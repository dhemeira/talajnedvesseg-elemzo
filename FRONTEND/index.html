<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talajnedvesség elemző</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h1>Talajnedvesség elemző</h1>

    <div class="row my-3">
      <div class="col-6">

        <div class="form-floating mb-3">
          <textarea class="form-control" placeholder="Talaj típusa" id="talaj-tipus" style="height: 12.5em"></textarea>
          <label for="talaj-tipus">Talaj típusa</label>
        </div>

        <div class="form-floating mb-3">
          <textarea class="form-control" placeholder="Mérés 1" id="meres-1" style="height: 12.5em"></textarea>
          <label for="meres-2">Mérés 1</label>
        </div>

        <div class="form-floating mb-3">
          <textarea class="form-control" placeholder="Mérés 2" id="meres-2" style="height: 12.5em"></textarea>
          <label for="meres-1">Mérés 2</label>
        </div>

        <div class="d-grid gap-3">
          <button type="button" onclick="submit()" class="btn btn-primary">Küldés</button>
          <div class="btn-group">
            <button type="button" onclick="testData5By5()" class="btn btn-primary">Minta adat 5x5</button>
            <button type="button" onclick="testData3By3()" class="btn btn-primary">Minta adat 3x3</button>
          </div>
        </div>
      </div>
      <div class="col-6">
        <table id="eredmeny-tabla">
          <tbody id="eredmeny"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>

</html>
